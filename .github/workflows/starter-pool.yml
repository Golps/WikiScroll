name: Starter pool
# Refreshes the bundled outage/offline cards in public/data/starter/ each week,
# resampling each language whose card library was rebuilt since the last run.
# A language whose library is thin or unreadable keeps its current pool.
# Old pools stay in Git history, so the job also opens an issue once the
# repository passes REPO_WARN_MB (GitHub suggests staying under 1 GB).
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: wikiscroll-starter-pool
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Dependencies install and tests run before the push, so the write
          # token stays out of the Git settings and only the push step gets it.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # pnpm is installed in a later step.
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the pool
        run: node scripts/build-starter.mjs
      - name: Test suite
        run: pnpm test
      - name: Commit the new pool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add public/data/starter
          if git diff --cached --quiet; then echo "Pool unchanged."; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh starter pool'
          # The build takes about half an hour, so main often moves meanwhile.
          # Replay the pool on top of it and test again before each push.
          # Kept in an unexported variable, so the tests below never see it.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"; unset GH_TOKEN
          for attempt in 1 2 3; do
            git -c http.https://github.com/.extraheader="$auth" push && exit 0
            git pull --rebase origin main
            pnpm test
          done
          exit 1
      - name: Warn when the repository grows large
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_WARN_MB: 500
        run: |
          kb=$(gh api "repos/$GITHUB_REPOSITORY" --jq .size) || { echo "Repository size unavailable."; exit 0; }
          mb=$((kb / 1024)); echo "Repository size: $mb MB (warning at $REPO_WARN_MB MB)." | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$mb" -ge "$REPO_WARN_MB" ] || exit 0
          title='Repository past the size warning'
          body="The repository is $mb MB. Weekly starter-pool commits keep old pools in Git history (about 90 MB a year). Consider building the pool at deploy time or trimming its history; see docs/STARTER-SOURCES.md."
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue comment --repo "$GITHUB_REPOSITORY" "$open" --body "$body"; else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi
