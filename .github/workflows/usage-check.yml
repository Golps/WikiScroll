name: Usage check
# Daily early warning before any usage ceiling: compares yesterday's Worker
# requests and this month's R2 storage and operations with Cloudflare's
# included usage (scripts/usage-check.mjs). Past half of one, it opens an issue.
# Needs a read-only CF_ANALYTICS_TOKEN secret, R2_ACCOUNT_ID and R2_GUARDS
# for the billing day. Missing configuration or unavailable analytics fail
# the run instead of reporting a successful check that never happened.
on:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
      R2_GUARDS: ${{ secrets.R2_GUARDS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Compare usage with its ceilings
        id: usage
        run: |
          set -o pipefail
          status=0; node scripts/usage-check.mjs > "$RUNNER_TEMP/usage.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/usage.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            echo '::error::Usage was not checked. See the step summary for the configuration or analytics error.'
            exit 1
          fi
      - name: Open an issue past half of a ceiling
        if: steps.usage.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Cloudflare usage check'
          if [ -n "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            gh issue comment --repo "$GITHUB_REPOSITORY" "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')" --body-file "$RUNNER_TEMP/usage.txt"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/usage.txt"
          fi
