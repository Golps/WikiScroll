name: Usage check
# Daily early warning before any usage ceiling: compares yesterday's Worker
# requests and this month's R2 storage and operations with Cloudflare's
# included usage (scripts/usage-check.mjs). Past a measure's warning level, it
# opens an issue for that measure.
# Needs a read-only CF_ANALYTICS_TOKEN secret, R2_ACCOUNT_ID and R2_GUARDS
# for the billing day. Missing configuration or unavailable analytics fail
# the run instead of reporting a successful check that never happened.
on:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
      R2_GUARDS: ${{ secrets.R2_GUARDS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Compare usage with its ceilings
        id: usage
        run: |
          set -o pipefail
          status=0; node scripts/usage-check.mjs > "$RUNNER_TEMP/usage.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/usage.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            echo '::error::Usage was not checked. See the step summary for the configuration or analytics error.'
            exit 1
          fi
      - name: Open an issue for each measure past its warning level
        if: steps.usage.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One issue per measure, so a new kind of warning is a new notification
          # and never one more comment on an issue about something else.
          grep -oP '^Past [0-9.]+% of its ceiling: \K.+$' "$RUNNER_TEMP/usage.txt" | while IFS= read -r measure; do
            title="Cloudflare usage check: $measure"
            open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
            if [ -n "$open" ]; then
              gh issue comment --repo "$GITHUB_REPOSITORY" "$open" --body-file "$RUNNER_TEMP/usage.txt"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/usage.txt"
            fi
          done
