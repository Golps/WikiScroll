name: Bug report
description: Something in WikiScroll doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open wikiscroll.com in Wikivoyage mode
        2. …
  - type: dropdown
    id: source
    attributes:
      label: Source
      options: [Wikipedia, Wikivoyage, Both, Not sure]
  - type: input
    id: environment
    attributes:
      label: Browser, device and language
      placeholder: e.g. Safari on iPhone 15, Hebrew interface
  - type: markdown
    attributes:
      value: Please don't include personal data, API keys or screenshots of account dashboards. Report security problems privately (see SECURITY.md).
