name: Usage check
# Daily early warning before any free-tier limit: compares yesterday's Worker
# requests and this month's R2 storage and operations with the free
# allowances (scripts/usage-check.mjs). Past half of one, it opens an issue.
# Needs a read-only CF_ANALYTICS_TOKEN secret; skipped until it is set.
on:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Compare usage with the free limits
        id: usage
        if: env.CF_ANALYTICS_TOKEN != ''
        run: |
          set -o pipefail
          status=0; node scripts/usage-check.mjs > "$RUNNER_TEMP/usage.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/usage.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          [ "$status" -eq 0 ] || [ "$status" -eq 1 ]
      - name: Open an issue past half of a free limit
        if: steps.usage.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Usage past half of a free Cloudflare limit'
          if [ -n "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            gh issue comment --repo "$GITHUB_REPOSITORY" "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')" --body-file "$RUNNER_TEMP/usage.txt"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/usage.txt"
          fi
